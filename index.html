<style>
  :root{ --green:#4CBB17; --lime:#9BF442; --pale:#E8FFD4; --gold:#FFB43A; --dim:#5C7A55; }

        background:linear-gradient(90deg,#2E9E1E,#9BF442,#FFF3D0,#FFB43A,#4CBB17);

  .tl{top:calc(env(safe-area-inset-top) + 16px);left:16px}
  .tr{top:calc(env(safe-area-inset-top) + 16px);right:16px;text-align:right}

      text-shadow:0 0 10px rgba(255,180,58,.8)}

  .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--lime);

  .cnr{position:fixed;width:24px;height:24px;z-index:5;pointer-events:none;
       border:1.5px solid rgba(76,187,23,.5);filter:drop-shadow(0 0 6px rgba(76,187,23,.5))}
  .c1{top:11px;left:11px;border-right:0;border-bottom:0}
  .c2{top:11px;right:11px;border-left:0;border-bottom:0}
  .c3{bottom:11px;left:11px;border-right:0;border-top:0}
  .c4{bottom:11px;right:11px;border-left:0;border-top:0}

  .status{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 108px);left:0;right:0;
          text-align:center;z-index:6;pointer-events:none}

            color:#E4FFC0;text-shadow:0 0 28px rgba(155,244,66,.9)}

  #convai{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:0;right:0;

            text-align:center;font-size:13px;color:var(--dim);z-index:10;display:none}

  @media (prefers-reduced-motion:reduce){.name,.dot{animation:none}}

<body>

<div id="fallback">
  Widget didn't load.
  <a href="https://elevenlabs.io/app/talk-to?agent_id=agent_9801m06x6g03ejgrehv2zecz2y6f">Open Jarvis directly &rarr;</a>
</div>

<script async src="https://unpkg.com/@elevenlabs/convai-widget-embed" type="text/javascript"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   Jarvis v4 — a galaxy that answers.

   WHY THE LAST ONE ONLY SPUN
   The audio tap used document.querySelectorAll('audio'). The ElevenLabs
   widget keeps its audio element inside a shadow DOM, and querySelectorAll
   does not cross shadow boundaries — so the analyser never attached and the
   scene had nothing to react to. Two fixes here:
     1. HTMLMediaElement.prototype.play is patched, so ANY element that starts
        playing announces itself no matter where in the tree it lives.
     2. A recursive walk that descends through every shadowRoot, as a backup.

   And the tap now uses createMediaStreamSource on the WebRTC stream rather
   than createMediaElementSource on the element. That matters: the element
   version REROUTES the audio through our graph, so a mistake there mutes
   Jarvis. The stream version only observes. It cannot break his voice.

   THE SCENE
   Centre is a real galaxy — two spiral arms of particles on differential
   orbits, so the inside turns faster than the outside, the way one actually
   does. It is the part that reacts: when he speaks the particles take a
   radial kick, brighten, and scatter, then settle. Outside, the instrument
   rings keep their own steady rotation regardless. Motion you can read as
   speech, over motion you can read as a machine idling.
   ══════════════════════════════════════════════════════════════════════════ */
const cv  = document.getElementById('sky');
const ctx = cv.getContext('2d', {alpha:false});
let W,H,CX,CY,R,DPR;

function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
  R  = Math.min(W,H) * 0.20;
}
addEventListener('resize', resize); resize();

const TAU = Math.PI*2;
const rnd = (a,b) => a + Math.random()*(b-a);
const G   = a => 'rgba(120,232,72,'  + a + ')';
const LI  = a => 'rgba(178,255,110,' + a + ')';
const GO  = a => 'rgba(255,180,58,'  + a + ')';
const HOT = a => 'rgba(248,255,226,' + a + ')';

/* ── the galaxy at the centre ── */
const ARMS = 2, PER_ARM = 300, HALO = 220;
const gal = [];
for (let a=0;a<ARMS;a++){
  const phase = a*(TAU/ARMS);
  for (let i=0;i<PER_ARM;i++){
    const f = i/PER_ARM;
    const r = 0.14 + f*0.86;
    gal.push({
      r, a: phase + Math.log(r+1)*4.4 + rnd(-.22,.22)*(1-f*.4),
      y: rnd(-1,1)*((1-f)*.16+.05),
      sz: rnd(.6,2.0), hot: Math.random()<.17,
      sp: rnd(.9,1.1), v:0, ph: Math.random()*TAU
    });
  }
}
for (let i=0;i<HALO;i++){
  gal.push({
    r: Math.pow(Math.random(),.6)*.55, a: Math.random()*TAU,
    y: rnd(-1,1)*.34, sz: rnd(.5,1.6), hot: Math.random()<.28,
    sp: rnd(.7,1.3), v:0, halo:true, ph: Math.random()*TAU
  });
}

/* ── outer instrument rings ── */
const RINGS = [
  {rr:1.62, w:3.0, sp: 0.00042, a:1.00, seg:[[.00,.20],[.26,.15],[.50,.26],[.84,.11]]},
  {rr:1.86, w:1.6, sp:-0.00027, a:.70,  seg:[[.04,.31],[.44,.19],[.70,.21]]},
  {rr:2.16, w:5.0, sp: 0.00015, a:.28,  seg:[[.00,.43],[.54,.28]]},
  {rr:2.36, w:1.6, sp:-0.00021, a:.60,  seg:[[.02,.09],[.16,.05],[.28,.14],[.50,.07],[.64,.11],[.82,.06]], gold:true},
  {rr:2.72, w:1.2, sp:-0.00010, a:.36,  seg:[[.08,.22],[.38,.22],[.68,.22]]},
  {rr:3.10, w:1.0, sp: 0.00007, a:.20,  seg:[[.14,.30],[.60,.30]]}
];
const rays = Array.from({length:46},(_,i)=>({
  a:(i/46)*TAU+rnd(-.03,.03), len:rnd(1.9,4.2), w:rnd(.5,2.2),
  al:rnd(.05,.26), ph:Math.random()*TAU, ps:rnd(.5,1.8), gold:Math.random()<.18
}));
const bokeh = Array.from({length:40},()=>({
  a:Math.random()*TAU, r:rnd(1.1,3.6), sz:rnd(16,70), al:rnd(.03,.10),
  sp:rnd(-.00012,.00012), gold:Math.random()<.22, ph:Math.random()*TAU, ps:rnd(.4,1.3)
}));
const waves = [];

const BARS = 84;
const bars = new Float32Array(BARS);
let t=0, amp=0, target=0, speaking=false, lastKick=0, haveFFT=false;

function frame(ts){
  t = ts||0;
  amp += (target-amp)*0.13;
  const beat = 1 + Math.sin(t/1080)*.028 + amp*.16;
  const glow = .55 + amp*.45;

  ctx.fillStyle = '#010B06'; ctx.fillRect(0,0,W,H);

  const air = ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.82);
  air.addColorStop(0,   'rgba(76,187,23,'+(.38+amp*.28)+')');
  air.addColorStop(.22, 'rgba(58,158,26,'+(.18+amp*.14)+')');
  air.addColorStop(.52, 'rgba(26,88,20,' +(.07+amp*.05)+')');
  air.addColorStop(1,   'rgba(1,11,6,0)');
  ctx.fillStyle = air; ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';

  for (const b of bokeh){
    b.a += b.sp;
    const tw = .6+.4*Math.sin(t/900*b.ps+b.ph);
    const x = CX+Math.cos(b.a)*R*b.r, y = CY+Math.sin(b.a)*R*b.r*.86;
    const g = ctx.createRadialGradient(x,y,0,x,y,b.sz);
    const c = b.gold ? '255,180,58' : '120,232,72';
    g.addColorStop(0,'rgba('+c+','+(b.al*tw*(1+amp))+')');
    g.addColorStop(1,'rgba('+c+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,b.sz,0,TAU); ctx.fill();
  }

  for (const ry of rays){
    const tw=.35+.65*Math.abs(Math.sin(t/1150*ry.ps+ry.ph));
    const a=ry.a+t*0.000024, ca=Math.cos(a), sa=Math.sin(a);
    const r0=R*1.45*beat, r1=R*ry.len*beat*(1+amp*.24);
    const gr=ctx.createLinearGradient(CX+ca*r0,CY+sa*r0,CX+ca*r1,CY+sa*r1);
    const c=ry.gold?'255,180,58':'150,244,86';
    gr.addColorStop(0,'rgba('+c+','+(ry.al*tw*glow*1.5)+')');
    gr.addColorStop(1,'rgba('+c+',0)');
    ctx.strokeStyle=gr; ctx.lineWidth=ry.w*(1+amp*.6);
    ctx.beginPath(); ctx.moveTo(CX+ca*r0,CY+sa*r0); ctx.lineTo(CX+ca*r1,CY+sa*r1); ctx.stroke();
  }

  /* ══ THE GALAXY — this is the part that answers ══ */
  const kick = amp > .30 && (t-lastKick) > 90;
  if (kick) lastKick = t;
  const core = R*1.30;
  for (const p of gal){
    /* differential rotation: inner orbits are faster, like a real disc */
    p.a += 0.00062 * p.sp / Math.max(.22, Math.sqrt(p.r)) * (1 + amp*2.4);
    /* speech gives every particle a radial shove that then settles */
    if (kick) p.v += amp*rnd(.02,.09);
    p.v *= .93;
    const rr = (p.r + p.v + amp*.10) * core * beat;
    const wob = p.halo ? 1 : (1 + Math.sin(t/520 + p.ph)*.04);
    const x = CX + Math.cos(p.a)*rr*wob;
    const y = CY + Math.sin(p.a)*rr*(p.halo?.88:.42) + p.y*core*.5;
    const s = p.sz*(1 + amp*.85 + p.v*3);
    const br = (p.hot ? .85 : .45) * (.42 + amp*.72) + p.v*2.2;
    ctx.fillStyle = p.hot ? HOT(Math.min(1,br)) : LI(Math.min(1,br*.9));
    ctx.beginPath(); ctx.arc(x,y,s,0,TAU); ctx.fill();
  }

  /* galactic core glow */
  const cg = ctx.createRadialGradient(CX,CY,0,CX,CY,R*(.62+amp*.34));
  cg.addColorStop(0,   'rgba(255,255,250,'+(.90+amp*.10)+')');
  cg.addColorStop(.16, 'rgba(236,255,196,'+(.72+amp*.22)+')');
  cg.addColorStop(.40, 'rgba(155,244,66,' +(.40+amp*.30)+')');
  cg.addColorStop(.72, 'rgba(255,180,58,' +(.10+amp*.14)+')');
  cg.addColorStop(1,   'rgba(20,80,20,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(CX,CY,R*(.62+amp*.34),0,TAU); ctx.fill();

  /* ══ the voice, wrapped around the galaxy ══ */
  const wr = R*1.42*beat;
  ctx.beginPath();
  for (let i=0;i<=BARS;i++){
    const k=i%BARS, a=(i/BARS)*TAU-Math.PI/2;
    const rr=wr+bars[k]*R*.70;
    const x=CX+Math.cos(a)*rr, y=CY+Math.sin(a)*rr;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
  ctx.strokeStyle = HOT(.34+amp*.62);
  ctx.lineWidth = 1.8+amp*3.0;
  ctx.stroke();

  /* ══ outer instrument rings — steady, indifferent to speech ══ */
  ctx.lineCap='butt';
  for (const g of RINGS){
    const rot=t*g.sp, rad=R*g.rr*beat;
    ctx.lineWidth=g.w*(1+amp*.25);
    ctx.strokeStyle=(g.gold?GO:LI)(g.a*glow*(g.gold?1:.85));
    for (const [st,len] of g.seg){
      ctx.beginPath(); ctx.arc(CX,CY,rad,rot+st*TAU,rot+(st+len)*TAU); ctx.stroke();
    }
  }
  const tr=R*2.00*beat, rotT=-t*0.00009;
  for (let i=0;i<96;i++){
    const a=rotT+(i/96)*TAU, long=i%8===0, L=long?R*.10:R*.045;
    const ca=Math.cos(a), sa=Math.sin(a);
    ctx.strokeStyle=LI((long?.55:.24)*glow); ctx.lineWidth=long?2:1;
    ctx.beginPath(); ctx.moveTo(CX+ca*tr,CY+sa*tr); ctx.lineTo(CX+ca*(tr+L),CY+sa*(tr+L)); ctx.stroke();
  }
  for (let i=0;i<4;i++){
    const a=-t*0.00013+i*(TAU/4), rad=R*2.90*beat, sz=R*.075;
    ctx.save(); ctx.translate(CX+Math.cos(a)*rad, CY+Math.sin(a)*rad); ctx.rotate(a+Math.PI/2);
    ctx.fillStyle=GO(.70);
    ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz*.62,sz*.55); ctx.lineTo(-sz*.62,sz*.55);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  for (let i=waves.length-1;i>=0;i--){
    const w=waves[i]; w.r+=w.v; w.v*=.986; w.a*=.960;
    if (w.a<.008){ waves.splice(i,1); continue; }
    ctx.strokeStyle=LI(w.a); ctx.lineWidth=1+w.a*5;
    ctx.beginPath(); ctx.arc(CX,CY,w.r,0,TAU); ctx.stroke();
  }

  ctx.globalCompositeOperation='source-over';
  const vg=ctx.createRadialGradient(CX,CY,Math.min(W,H)*.28,CX,CY,Math.max(W,H)*.82);
  vg.addColorStop(0,'rgba(1,11,6,0)'); vg.addColorStop(1,'rgba(0,5,3,.80)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function pulse(){ waves.push({r:R*1.3, v:R*.15, a:.55}); }

const hCore=document.getElementById('hCore'), hLvl=document.getElementById('hLvl');
setInterval(()=>{
  const n=Math.max(1,Math.round(Math.min(6,amp*7.5)));
  hLvl.textContent='▮'.repeat(n)+'▯'.repeat(6-n);
  hCore.textContent=(96+Math.round(amp*4))+'%';
},140);

/* ══════════════════ AUDIO — the part that was broken ══════════════════ */
const s1=document.getElementById('s1'), s2=document.getElementById('s2');
function say(a,b){ s1.textContent=a; if(b!==undefined) s2.textContent=b; }

let AC=null;
const analysers=[];
const media=new Set();

function ensureCtx(){
  if (AC) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;
  AC = new C();
  return AC;
}
/* iOS suspends the context until a real gesture — resume on any tap */
['pointerdown','touchstart','keydown'].forEach(ev =>
  addEventListener(ev, () => { if (AC && AC.state === 'suspended') AC.resume(); }, {passive:true}));

/* Observe the stream — never reroute it. createMediaStreamSource only reads.
   createMediaElementSource would take over the element's output, and a single
   mistake there silences Jarvis. Not a trade worth making for an animation. */
function tap(el){
  if (el.__tapped) return;
  const ms = el.srcObject;
  if (!ms || typeof ms.getAudioTracks !== 'function' || !ms.getAudioTracks().length) return;
  const ac = ensureCtx(); if (!ac) return;
  try{
    const src = ac.createMediaStreamSource(ms);
    const an  = ac.createAnalyser();
    an.fftSize = 512; an.smoothingTimeConstant = .62;
    src.connect(an);                       // analysis only — no destination
    analysers.push({an, buf:new Uint8Array(an.frequencyBinCount)});
    el.__tapped = true; haveFFT = true;
    if (ac.state === 'suspended') ac.resume();
  }catch(e){}
}

function watch(el){
  if (media.has(el)) { tap(el); return; }
  media.add(el);
  tap(el);
  el.addEventListener('playing', () => { tap(el); speaking = true; pulse(); say('Speaking',''); });
  el.addEventListener('loadedmetadata', () => tap(el));
  ['pause','ended','emptied'].forEach(ev => el.addEventListener(ev, () => {
    if ([...media].every(m => m.paused)){
      speaking = false;
      say('Listening','Speak naturally — interrupt any time');
    }
  }));
}

/* 1. Catch anything that plays, wherever it lives — including shadow DOM. */
const _play = HTMLMediaElement.prototype.play;
HTMLMediaElement.prototype.play = function(){
  try{ watch(this); }catch(e){}
  return _play.apply(this, arguments);
};

/* 2. Backup: walk the tree, descending into every shadow root. */
function walk(root){
  try{
    root.querySelectorAll('audio,video').forEach(watch);
    root.querySelectorAll('*').forEach(n => { if (n.shadowRoot) walk(n.shadowRoot); });
  }catch(e){}
}
setInterval(() => walk(document), 1200);

/* 3. Read whichever analyser is loudest; fall back to a synthetic cadence. */
(function poll(){
  let lvl = 0, any = false;
  for (const {an,buf} of analysers){
    an.getByteFrequencyData(buf);
    let s=0; for (let i=2;i<40;i++) s += buf[i];
    const v = Math.min(1,(s/38)/98);
    if (v > lvl) lvl = v;
    any = true;
    for (let i=0;i<BARS;i++){
      const b = buf[Math.floor(i/BARS*80)+2]/255;
      if (b > bars[i]) bars[i] = b;
    }
  }
  const playing = [...media].some(m => !m.paused);
  if (any && playing){
    target = lvl;
  } else if (playing){
    const w = Math.sin(performance.now()/150)*Math.sin(performance.now()/91);
    target = .30 + .38*Math.abs(w);
    for (let i=0;i<BARS;i++)
      bars[i] += ((.25+.65*Math.abs(Math.sin(performance.now()/190+i*.4)))*target - bars[i])*.25;
  } else {
    target = 0;
  }
  for (let i=0;i<BARS;i++) bars[i] *= .86;
  requestAnimationFrame(poll);
})();

setTimeout(() => {
  if (!document.querySelector('#convai elevenlabs-convai')?.shadowRoot){
    document.getElementById('fallback').style.display='block';
    say('Widget blocked','Use the link below — it works the same');
  } else {
    say('Ready','Tap the button below and start talking');
    pulse();
  }
}, 3500);
</script>
</body>
